name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            python: "3.12"
          - os: macos-26
            python: "3.13"
          - os: macos-26
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Runtime service-domain grammar
        run: python -m pytest -q tests/test_launchd_inventory.py --tb=short
      - name: Complete offline suite including native recordings
        run: python -m pytest -m "not acceptance" --cov=netorch --cov-branch --cov-context=test --evidence-report=test-evidence.json --evidence-coverage=.coverage --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Source and per-test evidence inventory
        if: always()
        run: python tools/test_inventory.py --evidence test-evidence.json --coverage .coverage --output test-inventory.json
      - name: Example policy and mock demonstration
        run: |
          netorch validate --config examples/network.json
          netorch validate --config examples/network-dns-fallback.json
          netorch deploy validate --manifest examples/deployment.json
          netorch simulate --config examples/network.json
          netorch demo
          netorch-host validate --instance examples/instance.json
          netorch-host validate --instance examples/instance-structural.json
          netorch-host plan --instance examples/instance.json
          netorch-host report --instance examples/instance.json > "$RUNNER_TEMP/host-report.json"
          bash -n platform/macos/pf/backend.sh
      - name: Darwin PF grammar only (never load rules)
        shell: bash
        run: |
          netorch render-pf --config examples/network.json \
            --snapshot examples/snapshot.json --admissions examples/admissions.json \
            --intent examples/intent.json --now 1000 > "$RUNNER_TEMP/netorch-preview.pf"
          sudo /sbin/pfctl -n -f "$RUNNER_TEMP/netorch-preview.pf"
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Install and run wheel outside the checkout
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          cp -R examples "$smoke_dir/examples"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --require-hashes -r requirements-lock.txt
          "$smoke_dir/venv/bin/python" -m pip install --no-deps --no-index dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -m pip check
          "$smoke_dir/venv/bin/netorch-host" --help
          "$smoke_dir/venv/bin/netorch-host" validate --instance examples/instance.json
          "$smoke_dir/venv/bin/netorch-host" validate --instance examples/instance-structural.json
          "$smoke_dir/venv/bin/netorch-host" report --instance examples/instance.json > host-report.json
          "$smoke_dir/venv/bin/netorch" --help
          "$smoke_dir/venv/bin/netorch" deploy --help
          "$smoke_dir/venv/bin/python" -m netorch.apple_runtime --help
          "$smoke_dir/venv/bin/python" -m netorch.bonjour_owner --help
          "$smoke_dir/venv/bin/python" -m netorch.pf_owner --help
          "$smoke_dir/venv/bin/python" -m netorch.workloads --help
          "$smoke_dir/venv/bin/python" -m netorch.migration_health --help
          "$smoke_dir/venv/bin/python" -c 'from importlib.resources import files; p = files("netorch"); assert all(p.joinpath(n + ".schema.json").is_file() for n in ("deployment", "instance", "host-evidence", "workload-contract", "acceptance-evidence")); assert p.joinpath("platform/macos/pf/backend.sh").is_file(); assert p.joinpath("observer_child.py").is_file()'
          "$smoke_dir/venv/bin/netorch" demo
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
            test-evidence.json
            test-inventory.json
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Format, lint, types and dependency audit
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install reviewed dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Public host-data guard
        run: python -m netorch.privacy_check --root . --exceptions schemas/privacy-exceptions.json
      - run: pip-audit -r requirements-dev-lock.txt --strict
