[build-system]
requires = ["hatchling==1.32.4", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "netorch"
version = "0.2.0"
description = "Typed network policy orchestration over independent platform owners"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Netorch contributors" }]
keywords = ["networking", "orchestration", "policy", "macos", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = ["jsonschema==4.26.0"]

[project.urls]
Repository = "https://github.com/mglaeser/network-orchestrator"
Issues = "https://github.com/mglaeser/network-orchestrator/issues"
Documentation = "https://github.com/mglaeser/network-orchestrator#readme"

[project.scripts]
netorch = "netorch.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.4",
  "pytest-cov==7.1.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-jsonschema==4.26.0.20260518",
  "build==1.6.1",
  "pip-audit==2.10.1",
  "pip-tools==7.6.1",
  "hatchling==1.32.4",
  "editables==0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netorch"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/network.schema.json" = "netorch/network.schema.json"
"schemas/deployment.schema.json" = "netorch/deployment.schema.json"
"platform/macos/pf/backend.sh" = "netorch/platform/macos/pf/backend.sh"
"examples/network.json" = "netorch/example-network.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/platform", "/tests", "/examples", "/schemas", "/docs", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/requirements*.txt", "/.github", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
markers = [
  "darwin: unprivileged macOS userspace contract tests",
  "acceptance: explicitly authorized hardware acceptance; never part of public CI",
]

[tool.coverage.run]
branch = true
source = ["netorch"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
platform = "darwin"
strict = true
warn_unreachable = true
files = ["src/netorch"]
